name: Deploy backend to production

on:
  push:
    branches: [production-deploy]
  pull_request:
    branches: [production-deploy]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (for rollback). Empty = branch tip."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci   # dummy; nothing connects to it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9            # same as the server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm type-check
      - run: pnpm build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configure SSH (runner -> bastion -> prod)
        env:
          BASTION_SSH_KEY: ${{ secrets.BASTION_SSH_KEY }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BASTION_SSH_KEY" | tr -d '\r' > ~/.ssh/bastion_key
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > ~/.ssh/prod_key
          chmod 600 ~/.ssh/bastion_key ~/.ssh/prod_key
          # Host public keys are not secret; pinned here (verified by fingerprint on each server).
          cat > ~/.ssh/known_hosts <<'KH'
          68.183.228.112 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKSzfkZOBeR9SNiVBFxmyLQtOlh9fvGOuXkuLWEjZkLX
          10.104.80.2 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBcX7QzFFNqV/9ctrHITZcKGaOHPFmDiJ6BYPmWj1FCI
          KH
          echo "Private keys GitHub received (fingerprints):"
          ssh-keygen -lf ~/.ssh/bastion_key || echo "!! BASTION_SSH_KEY secret is missing or malformed"
          ssh-keygen -lf ~/.ssh/prod_key || echo "!! PROD_SSH_KEY secret is missing or malformed"
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ vars.BASTION_HOST || '68.183.228.112' }}
            Port ${{ vars.BASTION_PORT || '22' }}
            User ${{ vars.BASTION_USER || 'gh-deploy' }}
            IdentityFile ~/.ssh/bastion_key
            IdentitiesOnly yes
          Host prod
            HostName ${{ vars.PROD_HOST || '10.104.80.2' }}
            User root
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            ProxyJump bastion
          Host *
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ServerAliveCountMax 8
            ConnectTimeout 20
          EOF

      - name: Deploy
        env:
          DEPLOY_SHA: ${{ inputs.sha || github.sha }}
        run: ssh prod "backend $DEPLOY_SHA"

      - name: Clean up keys
        if: always()
        run: rm -rf ~/.ssh
